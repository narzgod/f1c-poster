<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>F1C Poster Maker</title>
<style>

*{box-sizing:border-box}body{margin:0;background:#0b0b0d;color:#eee;font:15px system-ui,sans-serif}

#cv{height:38vh;aspect-ratio:4/5;max-width:96%;border-radius:6px}
nav{display:flex;gap:4px;padding:6px;overflow-x:auto}nav button{flex:1;white-space:nowrap}
button,.bt{background:#26262b;color:#fff;border:0;border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer;display:inline-block}

#panel{padding:12px;max-width:640px;margin:auto;padding-bottom:90px}
.c{background:#16161a;border-radius:10px;padding:10px;margin:0 0 10px}.h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.f{display:block;margin:0 0 8px}.f span{display:block;font-size:12px;color:#999;margin-bottom:3px}
input:not([type=checkbox]):not([type=range]):not([type=color]),select{width:100%;padding:10px;background:#1f1f24;color:#fff;border:1px solid #333;border-radius:8px;font-size:16px}
input[type=range]{width:100%}input[type=color]{width:100%;height:42px;border:0;background:none;padding:0}
.r{display:grid;grid-template-columns:34px 1fr 84px;gap:6px;margin-bottom:6px;align-items:center}
.u{display:flex;gap:8px;align-items:center;margin-bottom:8px}.u img,.u i{width:44px;height:44px;object-fit:contain;background:#333;border-radius:6px}
.w{width:100%;background:#e10600}.rn{display:flex;gap:10px;align-items:center}#panel .rn input[type=number]{width:92px;flex:none;text-align:center}.rn input[type=range],.rn input[type=color]{flex:1;min-width:0}#panel .rn input[type=text]{width:104px;flex:none;text-align:center;text-transform:uppercase}h3{margin:14px 0 8px}
#dl{position:fixed;bottom:0;left:0;right:0;border-radius:0;background:#e10600;padding:15px;font-weight:700;z-index:9}
#ts{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:8px 14px;border-radius:20px;opacity:0;transition:.3s;z-index:9}
</style></head><body>
<div id="top"><canvas id="cv" width="720" height="900"></canvas><nav id="nv"></nav></div>
<main id="panel"></main><button id="dl" data-a="dl">⬇ Unduh PNG</button><div id="ts"></div>
<script>

function trim(o){try{const i=o.i,c=document.createElement('canvas'),w=c.width=i.width,h=c.height=i.height,g=c.getContext('2d');g.drawImage(i,0,0);const d=g.getImageData(0,0,w,h).data;let a=w,b=h,e=0,f=0;

const F=(px,f,w=700)=>x.font=`${w} ${px}px "${f}",sans-serif`;
function T(s,px,fx,fy,al,col,f,mw,w){F(px,f||S.st.f2,w);x.textAlign=al;x.fillStyle=col;x.fillText(s,fx,fy,mw||999)}
function fit(i,bx,by,bw,bh){if(!i)return;const k=Math.min(bw/i.width,bh/i.height),w=i.width*k,h=i.height*k;x.drawImage(i,bx+(bw-w)/2,by+(bh-h)/2,w,h)}
const LY={
stripes:(l,s)=>{for(let i=-30;i<30;i++)x.fillRect(i*110*s,-1800,45*s,3600)},
checker:(l,s)=>{const q=22*s;for(let r=0;r<3;r++)for(let c=-50;c<50;c++)if((r+c)&1)x.fillRect(c*q,r*q-q*1.5,q,q)},
speed:(l,s)=>{let a=7;const R=()=>(a=a*16807%2147483647)/2147483647;for(let i=0;i<45;i++)x.fillRect((R()-.5)*1400,(R()-.5)*1400,(120+R()*500)*s,1+R()*3*s)},

dots:(l,s)=>{const q=16*s,n=Math.ceil(900/q);for(let i=-n;i<n;i++)for(let j=-n;j<n;j++){x.beginPath();x.arc(i*q,j*q,Math.max(0,(j*q+700)/1400)*q*.55,0,7);x.fill()}},
glow:(l,s)=>{const g=x.createRadialGradient(0,0,0,0,0,380*s);g.addColorStop(0,l.c);g.addColorStop(1,l.c+'00');x.fillStyle=g;x.fillRect(-1000,-1000,2000,2000)},
chevron:(l,s)=>{x.lineWidth=14*s;for(let i=-8;i<8;i++){x.beginPath();x.moveTo(i*46*s,-40*s);x.lineTo(i*46*s+30*s,0);x.lineTo(i*46*s,40*s);x.stroke()}},
kerb:(l,s)=>{for(let i=-40;i<40;i++){x.fillStyle=i&1?l.c:'#fff';x.fillRect(i*40*s,-15*s,40*s,30*s)}},
track:(l,s)=>{x.scale(s*2,s*2);x.translate(-150,-100);x.lineWidth=7;x.lineJoin='round';x.stroke(new Path2D('M30 150C20 100 70 110 100 80S170 20 215 55S285 130 235 168S110 185 70 172Z'))},

function head(){const e=S.ev,s=S.st;e.lg.forEach(g=>{const i=im(g.src);if(i){const k=g.h/i.height;x.drawImage(i,g.x-i.width*k/2,g.y-g.h/2,i.width*k,g.h)}});

const a=e.round+' ',b='/ '+e.place;F(40,s.f1);const wa=x.measureText(a).width,wb=x.measureText(b).width,x0=360-(wa+wb)/2;
T(a,40,x0,88,'left',s.gold,s.f1);T(b,40,x0+wa,88,'left','#fff',s.f1)}

x.fillStyle=e;x.fillRect(cx,cy+ah,w,44);const lk=s.pls*(t.ls??1);fit(im(t.logo),cx+8,cy+ah+22-19*lk,56*lk,38*lk);
const nm=((d&&(d.last||d.first))||'').toUpperCase(),mw=Math.max(50,w-22-56*lk),f0=Math.min(40,24*s.nm);F(f0,s.f2);T(nm,f0*Math.max(.3,Math.min(1,mw/x.measureText(nm).width)),cx+w-8-mw/2,cy+ah+23,'center',lum(e),s.f2);x.restore()}
function table(){const s=S.st,n=S.rows,rh=Math.min(44,316/Math.max(n,1)),lx=s.tlx,pk=s.pt;

x.fillStyle=k&1?s.rowB:s.rowA;x.fillRect(22,y,676,rh);x.fillStyle=s.red;x.fillRect(22,y,48,rh);
T(k+4,Math.min(26,rh*.6),46,m,'center','#fff',s.f1);
if(d){const fs=Math.min(rh*.85,Math.min(24,rh*.55)*s.nm),mw=lx-28*kk-8-85;F(fs,s.f2,400);const w1=d.first?x.measureText(d.first+' ').width:0;F(fs,s.f2);const q=Math.max(.3,Math.min(1,mw/(w1+x.measureText((d.last||'').toUpperCase()).width))),f=fs*q;

fit(im(t.logo),lx-28*kk,m-19*kk,56*kk,38*kk);
if(t.name){const tx=lx+28*kk+10,f0=Math.min(22,rh*.5),tn=t.name.toUpperCase();F(f0,s.f2,400);const q=Math.max(.3,Math.min(1,(640-tx)/x.measureText(tn).width));T(tn,f0*q,tx,m,'left','#ddd',s.f2,null,400)}
x.fillStyle=s.pc;x.fillRect(648,y,50,rh);const v=r.v;
if(v){if(!isNaN(v)&&rh>=34){T(v,Math.min(24,rh*.5)*pk,673,y+rh*.38,'center',s.gold,s.f1,46);T('pts',Math.min(17,rh*.38)*pk,673,y+rh*.74,'center',s.gold,s.f1,46)}else T(v,18,673,m,'center',s.gold,s.f1,44)}}}
function draw(){x.save();x.fillStyle=S.st.bg;x.fillRect(0,0,W,H);S.layers.forEach(l=>l.on&&layer(l));x.textBaseline='middle';head();[[1,17,181,215,356],[0,253,119,215,418],[2,483,198,215,339]].forEach(a=>card(...a));table();x.restore()}
function exp(){const k=S.st.k,o=document.createElement('canvas');o.width=W*k;o.height=H*k;const p=x;x=o.getContext('2d');x.scale(k,k);draw();x=p;o.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='race-result.png';a.click()})}
/* ---------- panel ---------- */
const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lab=(t,h)=>`<label class="f"><span>${t}</span>${h}</label>`,inp=(p,v,t='text')=>t=='color'?`<div class="rn"><input data-p="${p}" type="color" value="${E(v)}"><input data-p="${p}" data-hex="1" type="text" value="${E(v)}" maxlength="7" placeholder="#RRGGBB" autocapitalize="characters" spellcheck="false"></div>`:`<input data-p="${p}" type="${t}" value="${E(v)}">`;

let tab='res';

st:()=>{const fo=[...BASE,...S.cf.map(f=>f.n)].map(f=>[f,f]),s=S.st;
